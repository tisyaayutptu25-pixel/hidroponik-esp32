<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Hidroponik Caisim</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .header { background-color: #2e7d32; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 250px; }
        .card h3 { margin: 0; color: #555; font-size: 16px; }
        .card .value { font-size: 32px; font-weight: bold; margin: 10px 0; color: #2e7d32; }
        
        /* Style Grafik & Tabel */
        .chart-container, .table-container { 
            background: white; padding: 20px; border-radius: 15px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 20px auto; max-width: 900px; 
        }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background-color: #2e7d32; color: white; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌿 MONITORING HIDROPONIK CAISIM</h1>
    </div>

    <div class="container">
        <div class="card">
            <h3>🌡️ Suhu Udara</h3>
            <div class="value" id="txtSuhu">--°C</div>
        </div>
        <div class="card">
            <h3>💧 Kelembaban</h3>
            <div class="value" id="txtLembab">--%</div>
        </div>
        <div class="card">
            <h3>🧪 Tingkat pH</h3>
            <div class="value" id="txtPH">--</div>
        </div>
        <div class="card">
            <h3>🚰 Air Utama (W1)</h3>
            <div class="value" id="txtW1">--</div>
        </div>
        <div class="card">
            <h3>🔄 Air Cadangan (W2)</h3>
            <div class="value" id="txtW2">--</div>
        </div>
    </div>

    <div class="chart-container">
        <h3>📈 Grafik Real-time Suhu & Kelembaban</h3>
        <canvas id="myChart"></canvas>
    </div>

    <div class="table-container">
        <h3>📋 Log Riwayat Data</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Suhu (°C)</th>
                        <th>Lembab (%)</th>
                        <th>pH</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // 1. KONFIGURASI FIREBASE (Ganti dengan milikmu jika berbeda)
        const firebaseConfig = {
            databaseURL: "https://hidroponik-esp32-e0638-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref("/");

        // 2. INISIALISASI GRAFIK
        const ctx = document.getElementById('myChart').getContext('2d');
        const myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Suhu (°C)', data: [], borderColor: '#ff5252', tension: 0.3, fill: false },
                    { label: 'Lembab (%)', data: [], borderColor: '#448aff', tension: 0.3, fill: false }
                ]
            },
            options: { responsive: true }
        });

        // 3. AMBIL DATA DARI FIREBASE
        dbRef.on("value", (snapshot) => {
            const data = snapshot.val();
            const waktu = new Date().toLocaleTimeString();

            // Update Angka di Kartu
            document.getElementById("txtSuhu").innerText = data.Temperature + "°C";
            document.getElementById("txtLembab").innerText = data.Humidity + "%";
            document.getElementById("txtPH").innerText = data.pH;
            document.getElementById("txtW1").innerText = data.Water_Level_1;
            document.getElementById("txtW2").innerText = data.Water_Level_2;

            // Update Grafik (Simpan 10 titik data terakhir)
            if (myChart.data.labels.length > 10) {
                myChart.data.labels.shift();
                myChart.data.datasets[0].data.shift();
                myChart.data.datasets[1].data.shift();
            }
            myChart.data.labels.push(waktu);
            myChart.data.datasets[0].data.push(data.Temperature);
            myChart.data.datasets[1].data.push(data.Humidity);
            myChart.update();

            // Update Tabel (Data terbaru di paling atas)
            const tableBody = document.getElementById("tableBody");
            const newRow = `<tr>
                <td>${waktu}</td>
                <td>${data.Temperature}</td>
                <td>${data.Humidity}</td>
                <td>${data.pH}</td>
            </tr>`;
            tableBody.innerHTML = newRow + tableBody.innerHTML;

            // Batasi baris tabel agar tidak terlalu panjang (opsional, misal 20 baris)
            if (tableBody.rows.length > 20) { tableBody.deleteRow(20); }
        });
    </script>
</body>
</html>
