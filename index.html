<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Hidroponik Caisim</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; text-align: center; }
        .header { background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); color: white; padding: 20px; border-radius: 15px; margin-bottom: 25px; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); width: 220px; }
        .card h3 { margin: 0; color: #666; font-size: 13px; text-transform: uppercase; }
        .card .value { font-size: 28px; font-weight: bold; margin: 10px 0; color: #2e7d32; }
        
        .aktuator-section { background: white; padding: 20px; border-radius: 15px; margin: 20px auto; max-width: 900px; }
        .aktuator-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 15px; }
        .status-badge { padding: 10px 20px; border-radius: 30px; color: white; font-weight: bold; font-size: 14px; min-width: 100px; display: inline-block; }
        .on { background-color: #4caf50; box-shadow: 0 0 10px rgba(76, 175, 80, 0.4); }
        .off { background-color: #f44336; box-shadow: 0 0 10px rgba(244, 67, 54, 0.4); }

        .chart-container, .table-container { background: white; padding: 20px; border-radius: 15px; margin: 20px auto; max-width: 900px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background-color: #2e7d32; color: white; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌿 MONITORING HIDROPONIK CAISIM</h1>
        <p>Status Sistem: <span id="connStatus">Menghubungkan...</span></p>
    </div>

    <div class="container">
        <div class="card"><h3>🌡️ Suhu</h3><div class="value" id="txtSuhu">--°C</div></div>
        <div class="card"><h3>💧 Lembab</h3><div class="value" id="txtLembab">--%</div></div>
        <div class="card"><h3>🧪 pH Air</h3><div class="value" id="txtPH">--</div></div>
        <div class="card"><h3>🚰 Water 1</h3><div class="value" id="txtW1">--</div></div>
        <div class="card"><h3>🔄 Water 2</h3><div class="value" id="txtW2">--</div></div>
    </div>

    <div class="aktuator-section">
        <h3 style="margin: 0; color: #444;">⚙️ KONTROL AKTUATOR</h3>
        <div class="aktuator-container">
            <div>Kipas: <br><span id="statKipas" class="status-badge off">OFF</span></div>
            <div>Lampu: <br><span id="statLamp" class="status-badge off">OFF</span></div>
            <div>Pompa: <br><span id="statPump" class="status-badge off">OFF</span></div>
        </div>
    </div>

    <div class="chart-container">
        <h3>📈 Grafik Real-time Suhu & Kelembaban</h3>
        <canvas id="myChart"></canvas>
    </div>

    <script>
        // CONFIG FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDWuFmn2xX61-quPkEdZYg4nlcFKfAQdO8",
            authDomain: "monitoring-hidroponik-caisim.firebaseapp.com",
            databaseURL: "https://monitoring-hidroponik-caisim-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "monitoring-hidroponik-caisim",
            storageBucket: "monitoring-hidroponik-caisim.firebasestorage.app",
            messagingSenderId: "315733041840",
            appId: "1:315733041840:web:01efe9bfb7771d54f91175"
        };

        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref("/");

        // SETUP GRAFIK
        const ctx = document.getElementById('myChart').getContext('2d');
        const myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Suhu (°C)', data: [], borderColor: '#ff5252', tension: 0.3, fill: false },
                    { label: 'Lembab (%)', data: [], borderColor: '#448aff', tension: 0.3, fill: false }
                ]
            }
        });

        // AMBIL DATA
        dbRef.on("value", (snapshot) => {
            const root = snapshot.val();
            if (!root) return;
            
            document.getElementById("connStatus").innerText = "SISTEM LIVE";

            const s = root.sensor || {};
            const a = root.aktuator || {};
            const waktu = new Date().toLocaleTimeString();

            // PERBAIKAN: Mencari nama variabel yang mungkin digunakan (Huruf Besar/Kecil)
            const suhu = s.Temperature || s.temperature || s.suhu || s.temp || 0;
            const lembab = s.Humidity || s.humidity || s.kelembaban || s.hum || 0;
            const phVal = s.pH || s.ph || 0;
            const w1 = s.Water_Level_1 || s.water_level_1 || s.w1 || 0;
            const w2 = s.Water_Level_2 || s.water_level_2 || s.w2 || 0;

            // Update UI Angka
            document.getElementById("txtSuhu").innerText = suhu + "°C";
            document.getElementById("txtLembab").innerText = lembab + "%";
            document.getElementById("txtPH").innerText = phVal;
            document.getElementById("txtW1").innerText = w1;
            document.getElementById("txtW2").innerText = w2;

            // Update Aktuator (Sesuai nama variabel fan, growlight, pompa di Firebase kamu)
            const setStatus = (id, val) => {
                const el = document.getElementById(id);
                if (val === true || val == 1 || val === "ON") {
                    el.innerText = "ON"; el.className = "status-badge on";
                } else {
                    el.innerText = "OFF"; el.className = "status-badge off";
                }
            };
            
            setStatus("statKipas", a.fan);        
            setStatus("statLamp", a.growlight);   
            setStatus("statPump", a.pompa);       

            // Update Grafik
            if (myChart.data.labels.length > 10) {
                myChart.data.labels.shift();
                myChart.data.datasets[0].data.shift();
                myChart.data.datasets[1].data.shift();
            }
            myChart.data.labels.push(waktu);
            myChart.data.datasets[0].data.push(suhu);
            myChart.data.datasets[1].data.push(lembab);
            myChart.update();

        });
    </script>
</body>
</html>
