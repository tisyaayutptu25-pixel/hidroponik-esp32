<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Hidroponik Caisim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .stat-value { font-size: 2rem; font-weight: bold; color: #2ecc71; }
        .status-badge { padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; }
        .bg-on { background-color: #2ecc71; color: white; }
        .bg-off { background-color: #e74c3c; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-success mb-4">
        <div class="container text-center">
            <span class="navbar-brand mb-0 h1 w-100">🌿 MONITORING HIDROPONIK CAISIM</span>
        </div>
    </nav>

    <div class="container">
        <div class="row g-3">
            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <h5>🌡️ Suhu Udara</h5>
                    <div class="stat-value"><span id="suhu">--</span>°C</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <h5>💧 Kelembaban</h5>
                    <div class="stat-value"><span id="humid">--</span>%</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 text-center">
                    <h5>🧪 Tingkat pH</h5>
                    <div class="stat-value" style="color: #3498db;"><span id="ph">--</span></div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-3 text-center border-start border-primary border-5">
                    <h5>🌊 Air Utama (W1)</h5>
                    <div class="stat-value" id="water1_val">--</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3 text-center border-start border-info border-5">
                    <h5>🌊 Air Cadangan (W2)</h5>
                    <div class="stat-value" id="water2_val">--</div>
                </div>
            </div>
        </div>

        <h4 class="mt-5 mb-3 text-secondary text-center">Kontrol Aktuator</h4>
        <div class="row g-3 mb-5">
            <div class="col-4 text-center">
                <div class="card p-2">
                    <h6>Kipas</h6>
                    <div><span id="btn_fan" class="status-badge bg-off">OFF</span></div>
                </div>
            </div>
            <div class="col-4 text-center">
                <div class="card p-2">
                    <h6>Growlight</h6>
                    <div><span id="btn_grow" class="status-badge bg-off">OFF</span></div>
                </div>
            </div>
            <div class="col-4 text-center">
                <div class="card p-2">
                    <h6>Pompa</h6>
                    <div><span id="btn_pompa" class="status-badge bg-off">OFF</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // KONFIGURASI FIREBASE (Samakan dengan Project Firebase kamu)
        const firebaseConfig = {
            databaseURL: "https://monitoring-hidroponik-caisim-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Ambil Data Sensor
        db.ref("sensor").on("value", (snapshot) => {
            const data = snapshot.val();
            document.getElementById("suhu").innerText = data.suhu.toFixed(1);
            document.getElementById("humid").innerText = data.kelembaban.toFixed(1);
            document.getElementById("ph").innerText = data.ph.toFixed(1);
            document.getElementById("water1_val").innerText = data.water1;
            document.getElementById("water2_val").innerText = data.water2;
        });

        // Ambil Data Aktuator
        db.ref("aktuator").on("value", (snapshot) => {
            const data = snapshot.val();
            updateStatus("btn_fan", data.fan);
            updateStatus("btn_grow", data.growlight);
            updateStatus("btn_pompa", data.pompa);
        });

        function updateStatus(id, status) {
            const el = document.getElementById(id);
            if(status) {
                el.innerText = "ON";
                el.className = "status-badge bg-on";
            } else {
                el.innerText = "OFF";
                el.className = "status-badge bg-off";
            }
        }
    </script>
</body>
</html>
